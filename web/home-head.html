ent belong with you and your doctor."}}, {"@type": "Question", "name": "Is my voice recorded when I use voice logging?", "acceptedAnswer": {"@type": "Answer", "text": "The mic only listens when you tap it. Your words become a log entry and the audio is never stored."}}, {"@type": "Question", "name": "Does Skinpal show weather, pollen and air quality?", "acceptedAnswer": {"@type": "Answer", "text": "Yes. The home screen shows the weather, pollen and air quality for your town, next to your day."}}, {"@type": "Question", "name": "Is there a community in Skinpal?", "acceptedAnswer": {"@type": "Answer", "text": "Yes. Skinpal has a community inside the app where people living with eczema and TSW ask questions, share small wins and check in with each other."}}, {"@type": "Question", "name": "Is my data safe?", "acceptedAnswer": {"@type": "Answer", "text": "Your health data is never sold and never used for ads. Skinpal asks before it stores your health data, and you can delete your account and all your data at any time in Profile."}}, {"@type": "Question", "name": "What does Skinpal cost?", "acceptedAnswer": {"@type": "Answer", "text": "Skinpal is free for 14 days. After that it costs $3.99 a month or $39.99 a year."}}, {"@type": "Question", "name": "Which phones and languages does Skinpal support?", "acceptedAnswer": {"@type": "Answer", "text": "iPhone and Android, in English and Spanish."}}]}]</script>
