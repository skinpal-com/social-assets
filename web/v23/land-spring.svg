<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" preserveAspectRatio="xMidYMax slice"><style>.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 4.5s ease-in-out infinite alternate}
@keyframes sway{0%{transform:rotate(-2.2deg)}100%{transform:rotate(2.2deg)}}
.drift{animation:drift 60s ease-in-out infinite alternate}
@keyframes drift{0%{transform:translateX(-50px)}100%{transform:translateX(70px)}}
.glow{transform-box:fill-box;transform-origin:center;animation:glow 7s ease-in-out infinite}
@keyframes glow{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.07);opacity:1}}
.snow{animation:snow 12s linear infinite}
@keyframes snow{0%{transform:translate(0,0)}25%{transform:translate(18px,240px)}50%{transform:translate(-10px,480px)}75%{transform:translate(14px,720px)}100%{transform:translate(0,940px)}}
.rain{animation:rain 1.4s linear infinite}
@keyframes rain{0%{transform:translate(0,0)}100%{transform:translate(-60px,940px)}}
.petal{transform-box:fill-box;animation:petal 15s linear infinite}
@keyframes petal{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(60px,470px) rotate(200deg)}100%{transform:translate(-20px,940px) rotate(400deg)}}
.fly{animation:fly 4s ease-in-out infinite}
@keyframes fly{0%,100%{opacity:.15;transform:translate(0,0)}50%{opacity:1;transform:translate(8px,-18px)}}
.twinkle{animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){.sway,.drift,.glow,.snow,.rain,.petal,.fly,.twinkle,x{animation:none !important}}
